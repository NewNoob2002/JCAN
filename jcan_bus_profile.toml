# Fill these from the real bus specification before enabling. Values of zero
# deliberately keep physical traffic disabled.
nominal_bitrate = 0
data_bitrate = 0
fd_standard = 0

min_period_ms = 10
max_periodic_tasks = 4
cleanup_state = "stopped"
