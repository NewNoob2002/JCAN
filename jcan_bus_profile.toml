can_speed = "0c"
can_customval = "00 00 01 00 04 00 59 00 1e 00"
fd_speed = "06"
fd_customval = "00 00 03 00 04 00 1d 00 0a 00"
standard = "00"
term_res = "00"
busoff_recovery = "00"
auto_retrans = "00"

