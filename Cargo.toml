[package]
name = "jcan-cli"
version = "1.0.0"
edition = "2024"
description = "Native CLI for JooDevice JTool-CAN USB adapters"
license = "MIT"

[[bin]]
name = "jcan"
path = "src/main.rs"

[dependencies]
chrono = "0.4"
ctrlc = "3.4.7"
ratatui = { version = "0.30.0", default-features = false, features = ["crossterm"] }
rusb = "0.9.4"
serde_json = "1.0.143"
unicode-width = "0.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
